name: Optional beta Deploy Hook

on:
  push:
    branches: [feat/admin-portal]

# Native Vercel Git integration is the default. Enable this job only after
# completing OWNER-SETUP.md, setting the beta-only secret and opting in.
permissions: {}
concurrency:
  group: blbd-beta-deploy-hook
  cancel-in-progress: false

jobs:
  request-beta-build:
    if: >-
      github.repository == 'IllI/blbd' &&
      github.ref == 'refs/heads/feat/admin-portal' &&
      vars.BLBD_BETA_DEPLOY_MODE == 'hook'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the owner-configured beta build
        env:
          VERCEL_BETA_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_BETA_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_BETA_DEPLOY_HOOK_URL" ]]; then
            echo 'Missing VERCEL_BETA_DEPLOY_HOOK_URL. Complete OWNER-SETUP.md.' >&2
            exit 1
          fi
          case "$VERCEL_BETA_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/prj_pznncSeaqqpZWT6C0rBL7yVRXpxK/*) ;;
            *) echo 'Hook must belong to the existing BLBD Vercel project.' >&2; exit 1 ;;
          esac
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 10 --max-time 60 \
            "$VERCEL_BETA_DEPLOY_HOOK_URL"); then
            echo 'Deploy Hook request failed; inspect the hook privately.' >&2
            exit 1
          fi
          case "$status" in
            2??) echo 'Beta build requested. Check Vercel for completion and the deployed commit.' ;;
            *) echo 'Deploy Hook returned a non-success response.' >&2; exit 1 ;;
          esac
