<!--
  BLBD — Login page
  ===================================================================
  Paste this whole block into a single Webflow Embed element on the
  page you create for login (see webflow/INSTALL.md "Building the
  login page" for the two-line setup).

  Self-contained: its own scoped CSS (prefixed .blbd-login so nothing
  collides with the rest of the site), Poppins to match the real site
  font, and colors from the confirmed Starfire brand palette — it does
  NOT depend on Memberstack's classes, which only exist while
  Memberstack's own script is still injecting them.

  Google/Facebook buttons are wired and ready — they'll work the
  moment those providers are turned on in Supabase (see SETUP.md §1c).
  Until then they're a correct, functioning placeholder: clicking one
  shows a real "not enabled yet" message rather than doing nothing.
-->
<div class="blbd-login">
  <div class="blbd-login__panel">
    <div class="blbd-login__brand">
      <div class="blbd-login__wordmark">Better Living<br />Better Dying</div>
      <div class="blbd-login__mark" aria-hidden="true">✹ ✦ ✹</div>
    </div>
    <p class="blbd-login__tagline">
      A community for those ready to face life — and death — with courage, humor, and purpose.
    </p>
  </div>

  <div class="blbd-login__card">
    <a href="/" class="blbd-login__back">← Back to home</a>
    <h1 class="blbd-login__heading">Welcome back</h1>
    <p class="blbd-login__sub">Pick up where you left off.</p>

    <form data-blbd-form="login" class="blbd-login__form">
      <label class="blbd-login__field">
        <span>Email</span>
        <input data-blbd-input="email" type="email" name="email" autocomplete="email" required />
      </label>

      <label class="blbd-login__field">
        <span>Password</span>
        <input
          data-blbd-input="password"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </label>

      <div data-blbd-input="message" class="blbd-login__message" role="alert" hidden></div>

      <button type="submit" class="blbd-login__submit">Log in</button>

      <div class="blbd-login__divider"><span>or</span></div>

      <div class="blbd-login__social">
        <a href="#" data-blbd-oauth="google" class="blbd-login__social-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18Z"
            />
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34Z" />
            <path
              fill="#EA4335"
              d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58Z"
            />
          </svg>
          Continue with Google
        </a>
        <a href="#" data-blbd-oauth="facebook" class="blbd-login__social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#1877F2"
              d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07Z"
            />
          </svg>
          Continue with Facebook
        </a>
      </div>
    </form>

    <p class="blbd-login__footer">
      New here? <a href="/sign-up">Create an account</a>
    </p>
  </div>
</div>

<style>
  .blbd-login {
    display: flex;
    min-height: 100dvh;
    font-family: 'Poppins', sans-serif;
  }
  .blbd-login__panel {
    flex: 1 1 42%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 64px 56px;
    background: linear-gradient(135deg, #48468c, #28264d);
    color: #ffffff;
  }
  .blbd-login__brand { display: flex; flex-direction: column; gap: 12px; }
  .blbd-login__wordmark {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .blbd-login__mark { color: #9bdaf2; letter-spacing: 0.5em; font-size: 14px; }
  .blbd-login__tagline {
    max-width: 34ch;
    font-size: 17px;
    line-height: 1.6;
    color: #d7dcf5;
    margin: 0;
  }

  .blbd-login__card {
    flex: 1 1 58%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px clamp(24px, 8vw, 96px);
    max-width: 460px;
    margin: 0 auto;
    width: 100%;
  }
  .blbd-login__back {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #69778c;
    text-decoration: none;
  }
  .blbd-login__back:hover { color: #48468c; }
  .blbd-login__heading { font-size: 26px; font-weight: 700; color: #28264d; margin: 0 0 4px; }
  .blbd-login__sub { color: #69778c; margin: 0 0 28px; font-size: 15px; }

  .blbd-login__form { display: flex; flex-direction: column; gap: 18px; }
  .blbd-login__field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .blbd-login__field span { font-weight: 600; color: #28264d; }
  .blbd-login__field input {
    padding: 12px 14px;
    border: 1px solid #e4e8ed;
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    color: #28264d;
    background: #ffffff;
  }
  .blbd-login__field input:focus {
    outline: none;
    border-color: #6695f2;
    box-shadow: 0 0 0 3px rgba(102, 149, 242, 0.18);
  }

  .blbd-login__message {
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .blbd-login__message[data-blbd-tone='error'] {
    background: #fdecee;
    color: #99323c;
    border: 1px solid rgba(242, 82, 96, 0.3);
  }
  .blbd-login__message[data-blbd-tone='success'] {
    background: #e8f8f2;
    color: #0b6b50;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .blbd-login__submit {
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #48468c;
    color: #ffffff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .blbd-login__submit:hover { background: #302e59; }

  .blbd-login__divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
    color: #96a9b3;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .blbd-login__divider::before,
  .blbd-login__divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e4e8ed;
  }

  .blbd-login__social { display: flex; flex-direction: column; gap: 10px; }
  .blbd-login__social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid #e4e8ed;
    border-radius: 8px;
    background: #ffffff;
    color: #28264d;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .blbd-login__social-btn:hover { background: #f7f8fa; }

  .blbd-login__footer { margin-top: 24px; text-align: center; font-size: 14px; color: #69778c; }
  .blbd-login__footer a { color: #48468c; font-weight: 600; text-decoration: none; }
  .blbd-login__footer a:hover { text-decoration: underline; }

  @media (max-width: 860px) {
    .blbd-login { flex-direction: column; }
    .blbd-login__panel { padding: 40px 28px; }
    .blbd-login__card { padding: 40px 24px; }
  }
</style>
